#
# Weekly: does emb3d.mitre.org have an EMB3D release this copy lacks? The job
# fails when it does (the runner notifies the maintainers); a maintainer then
# runs `python3 tools/emb3d_update.py add <version>` and commits the result.
name: emb3d-update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container: docker.io/library/python:3-slim
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: Check emb3d.mitre.org
        run: |
          status=0
          python3 tools/emb3d_update.py check || status=$?
          if [ "$status" -eq 10 ]; then
            echo "A new EMB3D release is available: run tools/emb3d_update.py add <version>."
          fi
          exit "$status"

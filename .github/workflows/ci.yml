# SPDX-License-Identifier: GPL-2.0-only
#
# Checks of every push to main and every pull request. Written for Gitea and
# Forgejo (Codeberg) Actions, which both read .github/workflows: no
# JavaScript actions (the jobs run in plain containers without Node.js), only
# git, make and the GITHUB_* variables every runner sets. On Codeberg, set
# runs-on to one of its runner labels (for example codeberg-small).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests: every commit is a Conventional Commit (it decides the next
  # version and the changelog) and signed off (Developer Certificate of Origin).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-bookworm
    steps:
      - name: Check out the pull request and its base branch
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            fetch -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" "+$GITHUB_REF:refs/pr"
          git checkout -q refs/pr
      - run: make commit-check BASE="origin/$GITHUB_BASE_REF"

  # Formatting, clippy (static analysis, warnings are errors), tests with coverage.
  check:
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-bookworm
    steps:
      - name: Check out
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy llvm-tools-preview
          rustup target add wasm32-unknown-unknown
      - run: make lint
      - run: make test
      - run: make coverage

  # Known vulnerabilities (RustSec), licences and sources of the dependencies, SBOM.
  security:
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-bookworm
    steps:
      - name: Check out
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - run: make security
      - run: make sbom

  # Trivy: vulnerable dependencies, committed secrets and misconfigurations.
  # Its findings are in this job's log (Gitea and Forgejo have no code
  # scanning view); HIGH and CRITICAL ones fail the job.
  trivy:
    runs-on: ubuntu-latest
    container: docker.io/aquasec/trivy:0.58.1
    steps:
      - name: Check out
        run: |
          apk add --no-cache git
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - run: >
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --skip-dirs target --skip-dirs dist .

  # The PWA and the program with the PWA inside build from a clean tree.
  build:
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-bookworm
    steps:
      - name: Check out
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - run: rustup target add wasm32-unknown-unknown
      - run: make bin
      - run: target/release/emb-tm --version

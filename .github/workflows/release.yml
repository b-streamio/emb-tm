# SPDX-License-Identifier: GPL-2.0-only
#
# Release, started by a maintainer ("Run workflow" on main). The commit
# messages decide (Conventional Commits, cliff.toml): `make release` computes
# the next version from the commits since the last tag, writes Cargo.toml and
# CHANGELOG.md, commits and tags vX.Y.Z. If main is already tagged (a
# maintainer ran `make release` and pushed), that tag is published instead.
# Then every check runs, `make package` builds the release files and they are
# published as a release and a generic package (Gitea and Forgejo share
# these APIs).
#
# Needs a secret RELEASE_TOKEN: an access token of a maintainer with the
# write:repository and write:package scopes, allowed to push to main.
name: release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-bookworm
    steps:
      - name: Check out main with its history and tags
        run: |
          git init -q .
          git config http.extraHeader "Authorization: token ${{ secrets.RELEASE_TOKEN }}"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --tags origin main
          git checkout -q -B main FETCH_HEAD
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy llvm-tools-preview
          rustup target add wasm32-unknown-unknown
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
      - name: Version from the commits
        run: |
          tag=$(git tag --points-at HEAD 'v*' | head -n 1)
          if [ -z "$tag" ]; then
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@noreply.${GITHUB_SERVER_URL#*://}"
            make release
            tag=$(git describe --tags --exact-match)
          fi
          make release-check TAG="$tag"
          mkdir -p target && echo "$tag" > target/tag
      - run: make lint test coverage security
      - run: make package
      - name: Push the release commit and tag
        run: git push -q origin main "$(cat target/tag)"
      - name: Publish
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          tag=$(cat target/tag)
          version="${tag#v}"
          cd target/release-files
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          packages="$GITHUB_SERVER_URL/api/packages/${GITHUB_REPOSITORY%%/*}/generic/emb3d-wb/$version"
          auth="Authorization: token $TOKEN"
          body=$(python3 -c 'import json, sys; print(json.dumps({
              "tag_name": sys.argv[1], "name": "emb3d-wb " + sys.argv[2],
              "body": open("NOTES.md").read(), "prerelease": "-" in sys.argv[2]}))' \
            "$tag" "$version")
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api/releases" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          for f in *.tar.gz *.cdx.json THIRD-PARTY-LICENSES.txt SHA256SUMS; do
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" "$api/releases/$id/assets?name=$f" > /dev/null
            curl -fsS -X PUT -H "$auth" --upload-file "$f" "$packages/$f" > /dev/null
            echo "published $f"
          done

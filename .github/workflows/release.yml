# SPDX-License-Identifier: GPL-2.0-only
#
# Release of a SemVer tag (vMAJOR.MINOR.PATCH, see CONTRIBUTING.md): checks
# that the tag matches Cargo.toml and CHANGELOG.md, runs every check, builds
# the release files (make package) and publishes them as a release and as a
# generic package. Gitea and Forgejo share these APIs.
#
# Needs a secret RELEASE_TOKEN: an access token of a maintainer with the
# write:repository and write:package scopes.
name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-bookworm
    steps:
      - name: Check out
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - run: make release-check TAG="$GITHUB_REF_NAME"
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy llvm-tools-preview
          rustup target add wasm32-unknown-unknown
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
      - run: make lint test coverage security
      - run: make package
      - name: Publish
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          cd target/release-files
          version="${GITHUB_REF_NAME#v}"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          packages="$GITHUB_SERVER_URL/api/packages/${GITHUB_REPOSITORY%%/*}/generic/emb3d-wb/$version"
          auth="Authorization: token $TOKEN"
          body=$(python3 -c 'import json, sys; print(json.dumps({
              "tag_name": sys.argv[1], "name": "emb3d-wb " + sys.argv[2],
              "body": open("NOTES.md").read(), "prerelease": "-" in sys.argv[2]}))' \
            "$GITHUB_REF_NAME" "$version")
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api/releases" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          for f in *.tar.gz *.cdx.json THIRD-PARTY-LICENSES.txt SHA256SUMS; do
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" "$api/releases/$id/assets?name=$f" > /dev/null
            curl -fsS -X PUT -H "$auth" --upload-file "$f" "$packages/$f" > /dev/null
            echo "published $f"
          done

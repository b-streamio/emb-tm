<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="./style.css" integrity="@STYLE_SRI@">
<link rel="modulepreload" href="./emb3d-wb.js">
<!-- The wasm loader, the only inline script: it inflates emb3d-wb_bg.wasm.gz.
     The host allows it by the hash of what it serves. -->
<script type="module">
import init from './emb3d-wb.js';
const gz = await fetch('./emb3d-wb_bg.wasm.gz');
const wasm = new Response(gz.body.pipeThrough(new DecompressionStream('gzip')), { headers: { 'content-type': 'application/wasm' } });
await init({ module_or_path: wasm });
</script>
</head>

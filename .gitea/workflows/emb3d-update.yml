#
# Weekly: does emb3d.mitre.org have an EMB3D release this copy lacks? The job
# fails when it does (the runner notifies the maintainers); a maintainer then
# runs `python3 tools/emb3d_update.py add <version>` and commits the result.
name: emb3d-update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: builder
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: Basic $(printf 'ci:%s' "$TOKEN" | base64 -w0)" \
              fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Check emb3d.mitre.org
        run: |
          status=0
          nix-shell .config/shell.nix --run "python3 tools/emb3d_update.py check" || status=$?
          if [ "$status" -eq 10 ]; then
            echo "A new EMB3D release is available: run tools/emb3d_update.py add <version>."
          fi
          exit "$status"

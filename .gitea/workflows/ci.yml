# SPDX-License-Identifier: GPL-2.0-only
#
# emb-tm CI on git.b-stream.io (Gitea Actions). The jobs run on the
# organization's builder host (bstream-iac, src/apps/builder, label
# `builder`), which has bash, git and Nix: each step runs a make
# target in the build environment of .config/shell.nix (the tools of
# .config/Containerfile, from a pinned nixpkgs), so a job runs the same on
# a workstation (make image):
#
#   check     commit messages of a pull request, rustfmt, clippy, unit and
#             CLI tests with line coverage
#   trivy     vulnerable dependencies, committed secrets, misconfigurations
#   package   advisories, licences, SBOM and the release files (AppImage,
#             static program, PWA), published as emb-tm-dev/<branch>-<commit>
#   release   on main, when everything passed and the Conventional Commits
#             since the last tag call for it: version, CHANGELOG.md, tag, a
#             Gitea release and the package emb-tm/vX.Y.Z, and the same release
#             on GitHub (b-streamio/emb-tm) with the AppImage and the PWA
#
# The mirrors (Codeberg, GitHub) do not run it. Secrets: PACKAGES_TOKEN
# when the job token may not write packages (the release files),
# RELEASE_TOKEN when only a user may push the release commit to main (both
# optional), GH_RELEASE_TOKEN for the GitHub release (contents: write on
# b-streamio/emb-tm).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: builder
    steps:
      # (a pull request: with its base branch, for the commit messages)
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git config http.extraHeader "Authorization: Basic $(printf 'ci:%s' "$TOKEN" | base64 -w0)"
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
                "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" "$GITHUB_SHA"
          else
            git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          fi
          git checkout -q FETCH_HEAD
      - run: nix-shell .config/shell.nix --run "make check BASE=origin/${GITHUB_BASE_REF:-main}"

  # Findings are in this job's log (Gitea has no code scanning view); HIGH
  # and CRITICAL ones fail it.
  trivy:
    runs-on: builder
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: Basic $(printf 'ci:%s' "$TOKEN" | base64 -w0)" \
              fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: >
          nix-shell .config/shell.nix --run "trivy fs --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs target --skip-dirs dist
          --skip-files .config/Containerfile ."

  package:
    runs-on: builder
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: Basic $(printf 'ci:%s' "$TOKEN" | base64 -w0)" \
              fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: nix-shell .config/shell.nix --run "make package"
      - name: Publish
        # (a pull request runs its own code: no secret)
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
        run: nix-shell .config/shell.nix --run "make publish"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, trivy, package]
    runs-on: builder
    env:
      PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.PACKAGES_TOKEN || github.token }}
    steps:
      # (the history and the tags: the version comes from the commits since
      # the last tag)
      - name: Checkout
        run: |
          git init -q .
          git config http.extraHeader "Authorization: Basic $(printf 'ci:%s' "$PUSH_TOKEN" | base64 -w0)"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --tags origin "$GITHUB_SHA"
          git checkout -q -B main FETCH_HEAD
          git config user.name emb-tm-ci
          git config user.email "ci@${GITHUB_SERVER_URL#*://}"
      - run: nix-shell .config/shell.nix --run "make release"
      - name: Package, push and publish the release
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          tag=$(git tag --points-at HEAD 'v*' | head -n 1)
          [ -n "$tag" ] || exit 0
          nix-shell .config/shell.nix --run "make package"
          git push -q --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          nix-shell .config/shell.nix --run "make publish"
          nix-shell .config/shell.nix --run "make github"

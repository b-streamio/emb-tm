#
# git-cliff: the version and CHANGELOG.md come from the commit messages
# (Conventional Commits, see .github/CONTRIBUTING.md). `make release` uses it.

[changelog]
header = """
# Changelog

Generated from the commit messages by [git-cliff](https://git-cliff.org) at each release:
do not edit by hand. Versions follow [Semantic Versioning](https://semver.org/).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}\
{%- endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
# The first matching parser wins; the HTML comments only order the groups.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^fix\\(security\\)", group = "<!-- 0 -->Security" },
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^(perf|refactor)", group = "<!-- 3 -->Changed" },
    { message = "^revert", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(build|ci|test|style|chore)", skip = true },
]

[bump]
# feat → minor, fix → patch. Until 1.0.0 a breaking change raises the minor
# version (SemVer, 0.x); from 1.0.0 on, the major version.
features_always_bump_minor = true
breaking_always_bump_major = false
# No release tag yet: the first release is the version in Cargo.toml.
initial_tag = "v0.2.0"
